# Base44 sandbox dev environment for Once Human Guide.
#
# Runs the repo's own Python source from a plain runtime image (never a
# prebuilt app image) with the repo bind-mounted, so edits are live.
# The public preview (host port 3000) is served by `web`, which forwards "/"
# to the guide UI (/ui) and everything else to the API.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
services:
  db:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: ["python", "db_build.py"]
    restart: "no"

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - python -m pip install -q -r requirements.txt && exec python -m uvicorn api_main:app --host 0.0.0.0 --port 8000 --reload
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/stats', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    image: nginx:alpine
    volumes:
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ui || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# Base44 sandbox front door for Once Human Guide.
#
# The app's human entry point is the static v19 shell at /ui, while the API
# index lives at /. The Base44 preview always opens the origin root, so this
# small proxy sends "/" to the guide UI and forwards everything else to the
# API untouched (so /docs, /stats, /search, /audit, /modules, ... still work).
server {
    listen 80;
    server_name _;

    location = / {
        proxy_pass http://api:8000/ui;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
